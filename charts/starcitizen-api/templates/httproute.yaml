{{- if .Values.gatewayApi.enabled }}
{{- $fullName := include "starcitizen-api.fullname" . -}}
{{- $phpSvcName := $fullName -}}
{{- $phpSvcPort := .Values.api.service.port -}}
{{- $rustSvcName := printf "%s-rust-api" $fullName -}}
{{- $rustSvcPort := .Values.rustApi.service.port -}}
apiVersion: {{ .Values.gatewayApi.apiVersion }}
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "starcitizen-api.componentLabels" (dict "context" . "component" "api") | nindent 4 }}
    {{- with .Values.gatewayApi.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gatewayApi.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.gatewayApi.parentRefs }}
    - name: {{ required "gatewayApi.parentRefs[].name is required" .name }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
      {{- with .kind }}
      kind: {{ . }}
      {{- end }}
      {{- with .group }}
      group: {{ . }}
      {{- end }}
    {{- end }}
  {{- with .Values.gatewayApi.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.gatewayApi.rules }}
    {{- range .Values.gatewayApi.rules }}
    - {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        {{- if .backendRefs }}
        {{- range .backendRefs }}
        - name: {{ .name | default $phpSvcName }}
          port: {{ .port | default $phpSvcPort }}
          {{- with .weight }}
          weight: {{ . }}
          {{- end }}
          {{- with .kind }}
          kind: {{ . }}
          {{- end }}
          {{- with .group }}
          group: {{ . }}
          {{- end }}
          {{- with .namespace }}
          namespace: {{ . }}
          {{- end }}
        {{- end }}
        {{- else }}
        - name: {{ $phpSvcName }}
          port: {{ $phpSvcPort }}
        {{- end }}
    {{- end }}
    {{- else if .Values.rustApi.enabled }}
    {{/* When Rust API is enabled, route game-data API paths to it and
         everything else (frontend + DB-backed API endpoints) to PHP. */}}
    - matches:
        - path:
            type: PathPrefix
            value: /api/items
        - path:
            type: PathPrefix
            value: /api/weapons
        - path:
            type: PathPrefix
            value: /api/weapon-attachments
        - path:
            type: PathPrefix
            value: /api/clothes
        - path:
            type: PathPrefix
            value: /api/armor
        - path:
            type: PathPrefix
            value: /api/food
        - path:
            type: PathPrefix
            value: /api/vehicle-weapons
        - path:
            type: PathPrefix
            value: /api/vehicle-items
        - path:
            type: PathPrefix
            value: /api/vehicles
        - path:
            type: PathPrefix
            value: /api/ground-vehicles
        - path:
            type: PathPrefix
            value: /api/gravlev-vehicles
        - path:
            type: PathPrefix
            value: /api/blueprints
        - path:
            type: PathPrefix
            value: /api/manufacturers
        - path:
            type: PathPrefix
            value: /api/resource-types
        - path:
            type: PathPrefix
            value: /api/locations
      backendRefs:
        - name: {{ $rustSvcName }}
          port: {{ $rustSvcPort }}
    - matches:
        - path:
            type: PathPrefix
            value: /api/v3/items
        - path:
            type: PathPrefix
            value: /api/v3/weapons
        - path:
            type: PathPrefix
            value: /api/v3/weapon-attachments
        - path:
            type: PathPrefix
            value: /api/v3/clothes
        - path:
            type: PathPrefix
            value: /api/v3/armor
        - path:
            type: PathPrefix
            value: /api/v3/food
        - path:
            type: PathPrefix
            value: /api/v3/vehicle-weapons
        - path:
            type: PathPrefix
            value: /api/v3/vehicle-items
        - path:
            type: PathPrefix
            value: /api/v3/vehicles
        - path:
            type: PathPrefix
            value: /api/v3/ground-vehicles
        - path:
            type: PathPrefix
            value: /api/v3/gravlev-vehicles
        - path:
            type: PathPrefix
            value: /api/v3/blueprints
        - path:
            type: PathPrefix
            value: /api/v3/manufacturers
        - path:
            type: PathPrefix
            value: /api/v3/resource-types
        - path:
            type: PathPrefix
            value: /api/v3/locations
      backendRefs:
        - name: {{ $rustSvcName }}
          port: {{ $rustSvcPort }}
    {{/* Catch-all: frontend pages + DB-backed API (comm-links, galactapedia,
         stats, starsystems, celestial-objects, shipmatrix, game-versions) */}}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $phpSvcName }}
          port: {{ $phpSvcPort }}
    {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $phpSvcName }}
          port: {{ $phpSvcPort }}
    {{- end }}
{{- end }}
