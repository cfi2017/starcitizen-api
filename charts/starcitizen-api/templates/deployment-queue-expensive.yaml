{{- if .Values.queueExpensive.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "starcitizen-api.fullname" . }}-queue-expensive
  labels:
    {{- include "starcitizen-api.componentLabels" (dict "context" . "component" "queue-expensive") | nindent 4 }}
  {{- with (include "starcitizen-api.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.queueExpensive.replicaCount }}
  selector:
    matchLabels:
      {{- include "starcitizen-api.componentSelectorLabels" (dict "context" . "component" "queue-expensive") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "starcitizen-api.componentLabels" (dict "context" . "component" "queue-expensive") | nindent 8 }}
        {{- with .Values.queueExpensive.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "starcitizen-api.checksumAnnotations" . | nindent 8 }}
        {{- with .Values.queueExpensive.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "starcitizen-api.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.queueExpensive.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "starcitizen-api.initContainers" . | nindent 8 }}
      containers:
        - name: queue
          image: {{ include "starcitizen-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.queueExpensive.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: CONTAINER_ROLE
              value: queue
            - name: QUEUE_NAME
              value: expensive
            - name: QUEUE_TRIES
              value: {{ .Values.queueExpensive.tries | quote }}
            - name: QUEUE_MAX_JOBS
              value: {{ .Values.queueExpensive.maxJobs | quote }}
            - name: QUEUE_SLEEP
              value: {{ .Values.queueExpensive.sleep | quote }}
            - name: QUEUE_TIMEOUT
              value: {{ .Values.queueExpensive.timeout | quote }}
            - name: QUEUE_MEMORY
              value: {{ .Values.queueExpensive.memoryLimit | quote }}
            {{- include "starcitizen-api.secretEnv" . | nindent 12 }}
          envFrom:
            {{- include "starcitizen-api.envFrom" . | nindent 12 }}
          {{- with .Values.queueExpensive.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "starcitizen-api.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "starcitizen-api.volumes" . | nindent 8 }}
      {{- with .Values.queueExpensive.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.queueExpensive.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.queueExpensive.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
