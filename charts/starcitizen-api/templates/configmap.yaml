apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "starcitizen-api.configMapName" . }}
  labels:
    {{- include "starcitizen-api.labels" . | nindent 4 }}
  {{- with (include "starcitizen-api.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  {{- include "starcitizen-api.configEnv" . | nindent 2 }}
