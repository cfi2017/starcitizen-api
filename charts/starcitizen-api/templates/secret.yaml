apiVersion: v1
kind: Secret
metadata:
  name: {{ include "starcitizen-api.secretName" . }}
  labels:
    {{- include "starcitizen-api.labels" . | nindent 4 }}
  {{- with (include "starcitizen-api.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- /* APP_KEY: look up an existing key or generate one on first install */}}
  {{- if not .Values.app.existingKeySecret.name }}
  APP_KEY: {{ include "starcitizen-api.appKeyValue" . | quote }}
  {{- end }}
  {{- /* Database password: only stored here when no external secret is used */}}
  {{- if and (not .Values.postgres.enabled) (not .Values.externalDatabase.existingSecret.name) }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | default "" | quote }}
  {{- end }}
  {{- if and .Values.deepl.authKey (not .Values.deepl.existingSecret.name) }}
  DEEPL_AUTH_KEY: {{ .Values.deepl.authKey | quote }}
  {{- end }}
  {{- if and .Values.mail.password (not .Values.mail.existingSecret.name) }}
  MAIL_PASSWORD: {{ .Values.mail.password | quote }}
  {{- end }}
  {{- if and .Values.filesystem.s3.secretAccessKey (not .Values.filesystem.s3.existingSecret.name) }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.filesystem.s3.secretAccessKey | quote }}
  {{- end }}
