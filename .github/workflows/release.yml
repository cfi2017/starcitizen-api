name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  # ---------------------------------------------------------------------------
  # Package the Helm chart and push it to GHCR as an OCI artifact. The
  # application container image itself is built and published by docker.yml,
  # so this workflow does not rebuild it.
  # ---------------------------------------------------------------------------
  publish-chart:
    name: Package & push chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Resolve chart version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ref="${{ inputs.tag }}"
          else
            ref="${GITHUB_REF#refs/tags/}"
          fi
          version="${ref#v}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging chart version $version from $ref"

      - name: Bump Chart.yaml version
        working-directory: charts/starcitizen-api
        run: |
          version="${{ steps.version.outputs.version }}"
          sed -i -E "s/^version:.*/version: $version/" Chart.yaml
          echo "--- Chart.yaml ---"
          cat Chart.yaml

      - name: Update chart dependencies
        working-directory: charts/starcitizen-api
        run: helm dependency update

      - name: Helm lint
        working-directory: charts/starcitizen-api
        run: helm lint .

      - name: Package chart
        working-directory: charts/starcitizen-api
        run: helm package . --destination ../_packaged

      - name: Push chart to GHCR
        working-directory: charts/_packaged
        run: |
          version="${{ steps.version.outputs.version }}"
          helm push "starcitizen-api-${version}.tgz" "${{ env.CHART_REPO }}"

      - name: Upload chart package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: starcitizen-api-chart-${{ steps.version.outputs.version }}
          path: charts/_packaged/*.tgz
          if-no-files-found: error
          retention-days: 30
